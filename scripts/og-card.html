/assets/previews/echappee.webp" width="1520" height="950" alt="Échappée game capture"><div class="phone screen-viewport" id="social-app"><img src="../assets/previews/loadsense-en-detail.webp" width="880" height="1912" alt="LoadSense"></div><div class="index">TRAINING / EVERYDAY / FAMILY / PLAY</div><script>fetch('../content/preview-media.json').then(r=>r.json()).then(media=>{const m=media.LoadSense.en,[x,y,w,h]=m.frame||[0,0,1,1];const el=document.querySelector('#social-app');el.style.cssText=`--screen-ratio:${m.width*w/(m.height*h)};--screen-width:${100/w}%;--screen-left:${-100*x/w}%;--screen-top:${-100*y/h}%`;el.querySelector('img').src='..'+m.src;});for(let line=0;line<42;line++){let d='';for(let i=0;i<=180;i++){const t=i/180*Math.PI*2,r=1+.28*Math.cos(t*3+.2)+(line/41-.5)*.5;const x=800+Math.cos(t)*r*365,y=315+Math.sin(t)*r*210+Math.sin(t*3+line/21)*90;d+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)}const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);document.querySelector('#field').append(p)}</script></body></html>
