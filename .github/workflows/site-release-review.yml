name: Public site release review

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-release-review.yml'
      - 'content/**'
      - 'scripts/**'
      - 'assets/**'
      - 'styles.css'
      - 'index.html'
      - 'fr/**'
      - 'guides/**'
      - 'apps/**'
      - 'robots.txt'
      - 'sitemap*.xml'
      - 'site.webmanifest'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: bnjdpn/Studio/.github/workflows/site-review.yml@a8f9022b05f190cc3b692311d13526ad82b7fe68
